name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 1: Install JDK 17
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 2: Configure Android SDK via official setup-android action
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 3: Install Android SDK packages (API 34 + Build Tools 34.0.0)
      - name: Install Android SDK packages
        run: |
          mkdir -p $ANDROID_HOME
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # Step 4: Ensure Gradle wrapper script is executable
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Step 5: Build Debug APK using project Gradle wrapper
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 6: Verify APK was generated
      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # Step 7: Upload APK as downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
