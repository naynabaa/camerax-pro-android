name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 1: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 2: Point local.properties to pre-installed Android SDK
      - name: Setup local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Step 3: Make Gradle wrapper executable
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Step 4: Build Debug APK directly
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 5: Verify APK exists
      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # Step 6: Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CameraX-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
