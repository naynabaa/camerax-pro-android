name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Fetch MediaPipe 468 Face Mesh Model (with offline fallback)
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/face_landmarker.task" ]; then
            curl -fSL --retry 2 "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" -o app/src/main/assets/face_landmarker.task || rm -f app/src/main/assets/face_landmarker.task
          fi
          if [ ! -f "app/src/main/assets/hand_landmarker.task" ]; then
            curl -fSL --retry 2 "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" -o app/src/main/assets/hand_landmarker.task || rm -f app/src/main/assets/hand_landmarker.task
          fi
          if [ ! -f "app/src/main/assets/pose_landmarker_lite.task" ]; then
            curl -fSL --retry 2 "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" -o app/src/main/assets/pose_landmarker_lite.task || rm -f app/src/main/assets/pose_landmarker_lite.task
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK Generated
        run: |
          ls -la app/build/outputs/apk/debug/ || true
          find app/build/outputs/apk/ -name "*.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CameraX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Keep Recent Workflow & Delete Older Runs and Artifacts
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            for (const art of artifacts) {
              if (art.workflow_run && art.workflow_run.id === currentRunId) continue;
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: art.id });
              } catch (e) {
                core.warning('Failed to delete artifact ' + art.id + ': ' + e.message);
              }
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            for (const run of runs) {
              if (run.id === currentRunId || run.status === 'in_progress' || run.status === 'queued') continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
              } catch (e) {
                core.warning('Failed to delete run ' + run.id + ': ' + e.message);
              }
            }
