name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 1: Install JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 2: Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 3: Accept licenses & install packages
      - name: Install Android SDK packages & accept licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a2a3e039d69b8c3ca4952093dae\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a2a3e039d69b8c3ca4952093dae\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses || true
          sdkmanager --install "cmdline-tools;latest" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      # Step 4: Make Gradle Wrapper Executable
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Step 5: Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 6: Verify APK exists
      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # Step 7: Upload APK as downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
