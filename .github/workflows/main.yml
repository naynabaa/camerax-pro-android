name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Install JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 2: Configure local.properties with pre-installed Android SDK
      - name: Setup local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Step 3: Setup Gradle & ensure wrapper jar exists
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 4: Ensure Gradle wrapper executable and jar exist
      - name: Prepare Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating gradle-wrapper.jar..."
            gradle wrapper --gradle-version 8.9 || true
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      # Step 5: Build Debug APK using Gradle wrapper
      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # Step 6: Verify APK Exists
      - name: Verify APK Exists
        run: |
          ls -la app/build/outputs/apk/debug/ || true
          test -f app/build/outputs/apk/debug/app-debug.apk

      # Step 7: Upload APK as downloadable artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CameraX-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
