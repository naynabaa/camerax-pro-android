name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Install JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 2: Configure Android SDK from pre-installed runner environment
      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses || true

      # Step 3: Ensure Gradle wrapper script is executable
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Step 4: Build Debug APK using Gradle wrapper
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 5: Verify APK was generated
      - name: Verify APK Exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      # Step 6: Upload APK as downloadable artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CameraX-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
